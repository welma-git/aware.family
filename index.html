<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1E1C18;
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201,168,76,0.12) 0%, transparent 65%),
    radial-gradient(ellipse 40% 40% at 95% 110%, rgba(139,58,42,0.07) 0%, transparent 55%);

}
.inner {
  text-align: center;
  position: relative;
  z-index: 2;
  max-width: 520px;
}
.logo {
  display: inline-block;
  margin-bottom: 2.5rem;
}
h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.2rem, 5vw, 3.2rem);
  font-weight: 900;
  line-height: 1.08;
  letter-spacing: -0.02em;
  color: #F7F3EC;
  margin-bottom: 1.25rem;
}
h1 em { color: #C9A84C; font-style: italic; }
p {
  font-size: 15px;
  color: #6B6558;
  line-height: 1.75;
  margin-bottom: 2rem;
}
.badge {
  display: inline-block;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #C9A84C;
  border: 1px solid rgba(201,168,76,0.25);
  padding: 8px 20px;
  border-radius: 100px;
  margin-bottom: 2.5rem;
}
.credit {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #4A4540;
  margin-top: 3rem;
}
.credit a { color: #4A4540; text-decoration: none; transition: color 0.2s; }
.credit a:hover { color: #C9A84C; }

<div class="inner">
