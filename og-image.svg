    <linearGradient id="og-lg2" x1="88.93" y1="158.47" x2="119.12" y2="158.47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d348b"/>
      <stop offset="1" stop-color="#7678ed"/>
