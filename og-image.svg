  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#2a2363"/>

  <!-- Gradient glows -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decoration circles — right side -->
  <g transform="translate(960, 315)" opacity="0.12">
    <circle cx="0" cy="0" r="280" stroke="#7678ed" stroke-width="1" stroke-dasharray="8 10" fill="none"/>
    <circle cx="0" cy="0" r="210" stroke="#7678ed" stroke-width="0.75" fill="none"/>
    <circle cx="0" cy="0" r="140" stroke="#7678ed" stroke-width="0.75" stroke-dasharray="4 6" fill="none"/>
    <circle cx="0" cy="0" r="6" fill="#f7b801"/>
    <line x1="0" y1="-280" x2="0" y2="280" stroke="#7678ed" stroke-width="0.5" opacity="0.5"/>
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#7678ed" stroke-width="0.5" opacity="0.5"/>
    <circle cx="0" cy="-210" r="4" fill="none" stroke="#7678ed" stroke-width="1"/>
    <circle cx="0" cy="210" r="4" fill="none" stroke="#7678ed" stroke-width="1"/>
    <circle cx="-210" cy="0" r="4" fill="none" stroke="#7678ed" stroke-width="1"/>
    <circle cx="210" cy="0" r="4" fill="none" stroke="#7678ed" stroke-width="1"/>
  </g>

  <!-- Top rule -->
  <line x1="80" y1="68" x2="1120" y2="68" stroke="#7678ed" stroke-opacity="0.25" stroke-width="1"/>

