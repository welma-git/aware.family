<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="logoGold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8C97A"/>
    </linearGradient>
    <linearGradient id="logoGold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8C97A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#8B3A2A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B3A2A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1E1C18"/>

  <!-- Gradient glows -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Alchemical circles — right side decoration -->
  <g transform="translate(960, 315)" opacity="0.09">
    <circle cx="0" cy="0" r="280" stroke="#C9A84C" stroke-width="1" stroke-dasharray="8 10" fill="none"/>
    <circle cx="0" cy="0" r="210" stroke="#C9A84C" stroke-width="0.75" fill="none"/>
    <circle cx="0" cy="0" r="140" stroke="#C9A84C" stroke-width="0.75" stroke-dasharray="4 6" fill="none"/>
    <circle cx="0" cy="0" r="6" fill="#C9A84C"/>
    <line x1="0" y1="-280" x2="0" y2="280" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
    <circle cx="0" cy="-210" r="4" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <circle cx="0" cy="210" r="4" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <circle cx="-210" cy="0" r="4" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <circle cx="210" cy="0" r="4" fill="none" stroke="#C9A84C" stroke-width="1"/>
  </g>

