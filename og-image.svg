<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7678ed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7678ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#3d348b" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#3d348b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-lg1" x1="44.25" y1="182.81" x2="111.88" y2="182.81" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d348b"/>
      <stop offset="1" stop-color="#7678ed"/>
