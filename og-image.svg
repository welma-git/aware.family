  <!-- Logo group — scaled up from original SVG viewBox 40 140 318 82 -->
  <g transform="translate(80, 120) scale(1.085)">
    <defs>
      <linearGradient id="og-lg1" x1="44.25" y1="182.81" x2="111.88" y2="182.81" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#C9A84C"/>
        <stop offset="1" stop-color="#E8C97A"/>
      </linearGradient>
      <linearGradient id="og-lg2" x1="88.93" y1="158.47" x2="119.12" y2="158.47" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#C9A84C"/>
        <stop offset="1" stop-color="#E8C97A"/>
      </linearGradient>
    </defs>
    <path fill="url(#og-lg1)" transform="translate(-40,-140)" d="M88.61,216.63h-21.09c-12.83,0-23.28-10.44-23.28-23.28v-21.09c0-12.83,10.44-23.27,23.28-23.27h18.38c.65,0,1.17.52,1.17,1.17s-.52,1.17-1.17,1.17h-18.38c-11.54,0-20.93,9.39-20.93,20.93v21.09c0,11.54,9.39,20.93,20.93,20.93h21.09c11.54,0,20.92-9.39,20.92-20.93v-17.22c0-.65.52-1.17,1.17-1.17s1.17.52,1.17,1.17v17.22c0,12.83-10.44,23.28-23.27,23.28Z"/>
    <circle fill="url(#og-lg2)" transform="translate(-40,-140)" cx="104.02" cy="158.47" r="15.09"/>
    <text fill="white" font-family="'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" transform="translate(87.79 53.2)">aware.family</text>
  </g>

  <!-- Headline -->
  <text x="80" y="305" font-family="'Playfair Display', Georgia, serif" font-size="78" font-weight="900" fill="#F7F3EC" letter-spacing="-1">Aware families</text>
  <text x="80" y="395" font-family="'Playfair Display', Georgia, serif" font-size="78" font-weight="900" fill="#F7F3EC" letter-spacing="-1">have <tspan fill="#C9A84C" font-style="italic">more fun.</tspan></text>

  <!-- Descriptor -->
  <text x="80" y="460" font-family="'DM Sans', Arial, sans-serif" font-size="24" font-weight="300" fill="#6B6558">Find camps, classes, events &amp; experiences across Ontario.</text>

  <!-- Bottom rule -->
  <line x1="80" y1="530" x2="1120" y2="530" stroke="#C9A84C" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Footer: domain left, credit right -->
  <text x="80" y="562" font-family="'DM Mono', 'Courier New', monospace" font-size="15" letter-spacing="2" fill="#C9A84C" opacity="0.8">AWARE.FAMILY</text>
  <text x="1120" y="562" font-family="'DM Mono', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#6B6558" text-anchor="end">BY IDEA ALCHEMIST</text>
