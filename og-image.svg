  <text x="80" y="58" font-family="'DM Mono','Courier New',monospace" font-size="13" letter-spacing="3" fill="#f7b801" opacity="0.85" text-anchor="start">ONTARIO · KIDS &amp; FAMILY</text>

  <!-- Logo mark + wordmark -->
  <g transform="translate(80, 120) scale(1.085)">
    <path fill="url(#og-lg1)" transform="translate(-40,-140)" d="M88.61,216.63h-21.09c-12.83,0-23.28-10.44-23.28-23.28v-21.09c0-12.83,10.44-23.27,23.28-23.27h18.38c.65,0,1.17.52,1.17,1.17s-.52,1.17-1.17,1.17h-18.38c-11.54,0-20.93,9.39-20.93,20.93v21.09c0,11.54,9.39,20.93,20.93,20.93h21.09c11.54,0,20.92-9.39,20.92-20.93v-17.22c0-.65.52-1.17,1.17-1.17s1.17.52,1.17,1.17v17.22c0,12.83-10.44,23.28-23.27,23.28Z"/>
    <circle fill="url(#og-lg2)" transform="translate(-40,-140)" cx="104.02" cy="158.47" r="15.09"/>
    <text fill="white" font-family="'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" transform="translate(87.79 53.2)">aware.family</text>
  </g>

